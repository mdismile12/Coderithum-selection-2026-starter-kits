<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Deployment Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 30px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #1F4E78; border-bottom: 2px solid #1F4E78; padding-bottom: 10px; }
        .status-card { display: flex; justify-content: space-between; background: #e8f4f8; padding: 15px; border-radius: 6px; margin-bottom: 20px; }
        .badge { background: #28a745; color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        .task-list { list-style: none; padding: 0; }
        .task-item { background: #fafafa; border-left: 4px solid #1F4E78; padding: 12px; margin-bottom: 10px; border-radius: 4px; display: flex; justify-content: space-between; }
        .form-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input, button, select { padding: 10px; border-radius: 4px; border: 1px solid #ccc; }
        button { background-color: #1F4E78; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #153450; }
    </style>
</head>
<body>
    <div class="container">
        <h1>☁️ Campus Cloud Deployment Status</h1>
        
        <div class="status-card">
            <div>
                <strong>API Server Connection:</strong> <span id="api-status">Connecting...</span>
            </div>
            <div>
                <strong>Live Environment:</strong> <span class="badge" id="env-badge">PRODUCTION</span>
            </div>
        </div>

        <h3>Add Deployment Task</h3>
        <div class="form-group">
            <input type="text" id="task-title" placeholder="New Task Title..." style="flex-grow: 1;">
            <select id="task-priority">
                <option value="HIGH">HIGH</option>
                <option value="MEDIUM">MEDIUM</option>
                <option value="LOW">LOW</option>
            </select>
            <button onclick="addTask()">Add Task</button>
        </div>

        <h3>Active Tasks</h3>
        <ul class="task-list" id="tasks-container">
            <li>Loading tasks from live backend API...</li>
        </ul>
    </div>

    <script>
        // Configurable API URL for production deployment
        const API_BASE_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:5000'
            : 'https://your-backend-api-domain.com'; // Candidates update this with their live backend URL

        async function fetchHealth() {
            try {
                const res = await fetch(`${API_BASE_URL}/health`);
                const data = await res.json();
                document.getElementById('api-status').innerText = `✅ ONLINE (Uptime: ${Math.round(data.uptime_seconds)}s)`;
                document.getElementById('api-status').style.color = 'green';
            } catch (err) {
                document.getElementById('api-status').innerText = '❌ DISCONNECTED (Check API URL & CORS)';
                document.getElementById('api-status').style.color = 'red';
            }
        }

        async function loadTasks() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/tasks`);
                const json = await res.json();
                const container = document.getElementById('tasks-container');
                container.innerHTML = '';
                json.data.forEach(task => {
                    const li = document.createElement('li');
                    li.className = 'task-item';
                    li.innerHTML = `<span><strong>${task.title}</strong></span> <span>Priority: <em>${task.priority}</em></span>`;
                    container.appendChild(li);
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function addTask() {
            const title = document.getElementById('task-title').value;
            const priority = document.getElementById('task-priority').value;
            if (!title) return alert('Title required');

            await fetch(`${API_BASE_URL}/api/tasks`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, priority })
            });
            document.getElementById('task-title').value = '';
            loadTasks();
        }

        fetchHealth();
        loadTasks();
    </script>
</body>
</html>
